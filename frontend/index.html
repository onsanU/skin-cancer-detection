<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="基于深度学习的皮肤病变图像良恶性检测系统，辅助皮肤健康自检" />
    <title>皮肤癌图像检测系统</title>
    <script>
      /* 资源失效自愈：若构建产物 hash 变化导致旧 index.html 引用的 JS 404，
         页面会整片空白（React 根本不执行）。这里监听资源加载错误，
         一旦检测到来自 assets 的资源失败，就强制回源重载一次（带时间戳绕过缓存）。 */
      (function () {
        var tried = false
        window.addEventListener(
          'error',
          function (e) {
            var t = e.target
            if (tried || !t || !t.tagName) return
            var src = t.src || t.href || ''
            if (!/\/app\/assets\//.test(src)) return
            tried = true
            var u = new URL(location.href)
            u.searchParams.set('_r', Date.now())
            location.replace(u.toString())
          },
          true
        )
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
