<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>用户统计 · 皮肤癌检测系统管理后台</title>
  <link rel="stylesheet" href="vendor/adminlte/css/adminlte.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="vendor/overlayscrollbars/overlayscrollbars.min.css">
  <style>
    .tbl-sm td, .tbl-sm th { font-size: 13px; vertical-align: middle; }
    .tbl-sm.table-striped > tbody > tr:nth-of-type(odd) > * {
      background: rgba(255,255,255,.03);
    }
    .tbl-sm.table-striped > tbody > tr > * { border-color: rgba(255,255,255,.08); }
    .table-light { --bs-table-bg: rgba(255,255,255,.06); --bs-table-color: var(--bs-body-color); }
    .avatar { width: 34px; height: 34px; border-radius: 50%; background: #0b6fa4;
              color: #fff; display: inline-flex; align-items: center; justify-content: center;
              font-size: 14px; font-weight: 600; }
    .clickable { cursor: pointer; }
    .clickable:hover { background: rgba(255,255,255,.07); }
  </style>
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
<div id="app-content">
  <!-- 概览卡 -->
  <div class="row g-3 mb-3">
    <div class="col-6 col-md-3">
      <div class="card text-center h-100"><div class="card-body py-3">
        <div class="h3 mb-0" id="o-users">—</div>
        <div class="text-muted small">注册用户</div></div></div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card text-center h-100"><div class="card-body py-3">
        <div class="h3 mb-0 text-success" id="o-active">—</div>
        <div class="text-muted small">活跃用户（有检测）</div></div></div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card text-center h-100"><div class="card-body py-3">
        <div class="h3 mb-0 text-primary" id="o-avg">—</div>
        <div class="text-muted small">人均检测次数</div></div></div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card text-center h-100"><div class="card-body py-3">
        <div class="h3 mb-0 text-danger" id="o-admin">—</div>
        <div class="text-muted small">管理员账号</div></div></div>
    </div>
  </div>

  <!-- 筛选 -->
  <div class="card mb-3"><div class="card-body py-3">
    <div class="row g-2 align-items-end">
      <div class="col-md-3">
        <label class="form-label small mb-1">角色</label>
        <select class="form-select form-select-sm" id="f-role">
          <option value="">全部角色</option>
          <option value="admin">管理员</option>
          <option value="user">普通用户</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label small mb-1">关键词</label>
        <input class="form-control form-control-sm" id="f-keyword"
               placeholder="用户名 / 邮箱 / 姓名">
      </div>
      <div class="col-md-5 d-flex gap-2">
        <button class="btn btn-sm btn-primary" id="btn-search">
          <i class="bi bi-search"></i> 查询</button>
        <button class="btn btn-sm btn-outline-secondary" id="btn-reset">
          <i class="bi bi-arrow-counterclockwise"></i> 重置</button>
        <button class="btn btn-sm btn-outline-info ms-auto" id="btn-export-csv">
          <i class="bi bi-download"></i> 导出 CSV</button>
      </div>
    </div>
  </div></div>

  <!-- 用户表 -->
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h3 class="card-title mb-0"><i class="bi bi-people me-1"></i> 用户列表
        <span class="badge text-bg-secondary ms-1" id="totalBadge">—</span></h3>
      <button class="btn btn-sm btn-outline-secondary" id="btn-reload">
        <i class="bi bi-arrow-clockwise"></i></button>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover tbl-sm mb-0">
          <thead class="table-light"><tr>
            <th style="width:60px">ID</th>
            <th>用户</th>
            <th>邮箱</th>
            <th style="width:90px">角色</th>
            <th style="width:90px">状态</th>
            <th style="width:100px" class="text-end">检测次数</th>
            <th style="width:110px" class="text-end">其中恶性</th>
            <th style="width:150px">注册时间</th>
            <th style="width:96px">操作</th>
          </tr></thead>
          <tbody id="tbody">
            <tr><td colspan="9" class="text-center text-muted py-4">加载中…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="card-footer d-flex justify-content-between align-items-center">
      <span class="text-muted small" id="pageInfo">—</span>
      <div id="pagerBox"></div>
    </div>
  </div>
</div>

<!-- 用户详情 -->
<div class="modal fade" id="userModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-person-badge me-1"></i> 用户详情</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="userBody">
        <div class="text-center py-4"><div class="spinner-border"></div></div>
      </div>
      <div class="modal-footer">
        <a class="btn btn-outline-primary me-auto" id="goRecords" href="#">
          <i class="bi bi-images"></i> 查看该用户全部记录</a>
        <button class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
      </div>
    </div>
  </div>
</div>

<script src="vendor/adminlte/js/bootstrap.bundle.min.js"></script>
<script src="vendor/adminlte/js/adminlte.min.js"></script>
<script src="admin.js"></script>
<script>
let state = { limit: 20, offset: 0, role: '', keyword: '', total: 0, items: [] };
let userModal = null;

if (Admin.guardAdmin()) {
  Admin.renderLayout('users.html', '用户统计');
  userModal = new bootstrap.Modal(document.getElementById('userModal'));
  document.getElementById('btn-search').onclick = () => { syncF(); state.offset = 0; load(); };
  document.getElementById('btn-reset').onclick = () => {
    document.getElementById('f-role').value = '';
    document.getElementById('f-keyword').value = '';
    state.role = ''; state.keyword = ''; state.offset = 0; load();
  };
  document.getElementById('btn-reload').onclick = () => load();
  document.getElementById('f-keyword').addEventListener('keydown', e => {
    if (e.key === 'Enter') { syncF(); state.offset = 0; load(); }
  });
  document.getElementById('btn-export-csv').onclick = exportCsv;
  load();
}

function syncF() {
  state.role = document.getElementById('f-role').value;
  state.keyword = document.getElementById('f-keyword').value.trim();
}

function qs() {
  const p = new URLSearchParams();
  p.set('limit', state.limit);
  p.set('offset', state.offset);
  if (state.role) p.set('role', state.role);
  if (state.keyword) p.set('keyword', state.keyword);
  return p.toString();
}

async function load() {
  const tb = document.getElementById('tbody');
  tb.innerHTML = '<tr><td colspan="9" class="text-center text-muted py-4">加载中…</td></tr>';
  try {
    const d = await Admin.api('/users?' + qs());
    state.total = d.total;
    state.items = d.items;
    document.getElementById('totalBadge').textContent = d.total + ' 人';
    renderOverview(d.items, d.total);

    if (!d.items.length) {
      tb.innerHTML = '<tr><td colspan="9" class="text-center text-muted py-5">' +
        '<i class="bi bi-inbox fs-3 d-block mb-2"></i>没有符合条件的用户</td></tr>';
    } else {
      tb.innerHTML = d.items.map(u => {
        const isAdmin = u.role === 'admin';
        return '<tr class="clickable" onclick="showUser(' + u.id + ')">' +
          '<td class="text-muted">#' + u.id + '</td>' +
          '<td><span class="avatar me-2">' + Admin.esc((u.username || '?')[0].toUpperCase()) +
            '</span><span class="fw-semibold">' + Admin.esc(u.username) + '</span>' +
            (u.full_name ? '<div class="text-muted" style="font-size:11.5px">' +
              Admin.esc(u.full_name) + '</div>' : '') + '</td>' +
          '<td class="text-muted" style="font-size:12px">' + Admin.esc(u.email) + '</td>' +
          '<td>' + (isAdmin ? '<span class="badge text-bg-danger">管理员</span>'
                            : '<span class="badge text-bg-secondary">普通用户</span>') + '</td>' +
          '<td>' + (u.is_active
            ? '<span class="badge text-bg-success">正常</span>'
            : '<span class="badge text-bg-dark">已禁用</span>') + '</td>' +
          '<td class="text-end fw-semibold">' + u.record_count + '</td>' +
          '<td class="text-end">' + (u.malignant_count
            ? '<span class="text-danger">' + u.malignant_count + '</span>' : '0') + '</td>' +
          '<td class="text-muted" style="font-size:12px">' + Admin.fmtTime(u.created_at) + '</td>' +
          '<td onclick="event.stopPropagation()">' +
            '<a class="btn btn-sm btn-outline-primary py-0 px-2" href="records.html?username=' +
            encodeURIComponent(u.username) + '" title="查看记录"><i class="bi bi-images"></i></a>' +
            '<a class="btn btn-sm btn-outline-secondary py-0 px-2 ms-1" href="accounts.html?keyword=' +
            encodeURIComponent(u.username) + '" title="账号管理"><i class="bi bi-gear"></i></a>' +
          '</td></tr>';
      }).join('');
    }
    renderPager();
  } catch (e) {
    tb.innerHTML = '<tr><td colspan="9" class="text-center text-danger py-4">加载失败：' +
      Admin.esc(e.message) + '</td></tr>';
  }
}

function renderOverview(items, total) {
  // 概览用全部数据（拉一次全量轻量统计）
  const active = items.filter(u => u.record_count > 0).length;
  const sumRec = items.reduce((a, u) => a + u.record_count, 0);
  document.getElementById('o-users').textContent = total;
  document.getElementById('o-active').textContent = active;
  document.getElementById('o-avg').textContent = total ? (sumRec / total).toFixed(1) : '0';
  document.getElementById('o-admin').textContent = items.filter(u => u.role === 'admin').length;
}

function renderPager() {
  const p = Admin.pager(state.total, state.limit, state.offset);
  document.getElementById('pagerBox').innerHTML = p.html;
  const from = state.total ? state.offset + 1 : 0;
  const to = Math.min(state.offset + state.limit, state.total);
  document.getElementById('pageInfo').textContent =
    '第 ' + from + '-' + to + ' 条 / 共 ' + state.total + ' 人 · 第 ' + p.cur + '/' + p.pages + ' 页';
  p.bind(page => { state.offset = (page - 1) * state.limit; load(); });
}

async function showUser(id) {
  const body = document.getElementById('userBody');
  body.innerHTML = '<div class="text-center py-4"><div class="spinner-border"></div></div>';
  userModal.show();
  try {
    const d = await Admin.api('/users/' + id);
    document.getElementById('goRecords').href =
      'records.html?username=' + encodeURIComponent(d.username);
    const recs = d.recent_records || [];
    body.innerHTML =
      '<div class="row g-3 mb-3">' +
      '<div class="col-md-6"><table class="table table-sm mb-0">' +
      '<tr><th style="width:100px">用户名</th><td class="fw-semibold">' + Admin.esc(d.username) + '</td></tr>' +
      '<tr><th>邮箱</th><td>' + Admin.esc(d.email) + '</td></tr>' +
      '<tr><th>姓名</th><td>' + (Admin.esc(d.full_name) || '—') + '</td></tr>' +
      '</table></div>' +
      '<div class="col-md-6"><table class="table table-sm mb-0">' +
      '<tr><th style="width:100px">角色</th><td>' + (d.role === 'admin'
        ? '<span class="badge text-bg-danger">管理员</span>'
        : '<span class="badge text-bg-secondary">普通用户</span>') + '</td></tr>' +
      '<tr><th>状态</th><td>' + (d.is_active
        ? '<span class="badge text-bg-success">正常</span>'
        : '<span class="badge text-bg-dark">已禁用</span>') + '</td></tr>' +
      '<tr><th>注册时间</th><td>' + Admin.fmtTime(d.created_at) + '</td></tr>' +
      '</table></div></div>' +
      '<div class="d-flex align-items-center mb-2">' +
      '<span class="fw-semibold me-2">检测统计</span>' +
      '<span class="badge text-bg-primary">共 ' + d.record_count + ' 次</span>' +
      '<span class="badge text-bg-danger ms-1">恶性 ' + (d.malignant_count || 0) + '</span></div>' +
      (recs.length
        ? '<div class="table-responsive"><table class="table table-sm table-striped mb-0">' +
          '<thead class="table-light"><tr><th>ID</th><th>文件名</th><th>结果</th>' +
          '<th>置信度</th><th>时间</th></tr></thead><tbody>' +
          recs.map(r => '<tr><td>#' + r.id + '</td>' +
            '<td class="text-truncate" style="max-width:220px">' + Admin.esc(r.filename) + '</td>' +
            '<td>' + Admin.esc(r.label_cn) + '</td>' +
            '<td>' + Admin.fmtPct(r.probability) + '</td>' +
            '<td class="text-muted" style="font-size:12px">' + Admin.fmtTime(r.created_at) +
            '</td></tr>').join('') +
          '</tbody></table></div>' +
          '<div class="text-muted small mt-2">仅显示最近 10 条，完整记录请点下方按钮</div>'
        : '<div class="alert alert-light mb-0">该用户暂无检测记录</div>');
  } catch (e) {
    body.innerHTML = '<div class="alert alert-danger">加载失败：' + Admin.esc(e.message) + '</div>';
  }
}

function exportCsv() {
  const rows = [['ID', '用户名', '邮箱', '姓名', '角色', '状态', '检测次数', '恶性数', '注册时间']];
  state.items.forEach(u => rows.push([
    u.id, u.username, u.email, u.full_name || '',
    u.role, u.is_active ? '正常' : '已禁用',
    u.record_count, u.malignant_count, u.created_at
  ]));
  const csv = '\ufeff' + rows.map(r => r.map(c =>
    '"' + String(c === null || c === undefined ? '' : c).replace(/"/g, '""') + '"'
  ).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'users_' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
  Admin.toast('已导出 ' + state.items.length + ' 条（当前页）');
}
</script>
</body>
</html>
